apiVersion: v1
kind: Namespace
metadata:
  name: pong
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pong-nginx
  namespace: pong
data:
  default.conf: |
    server {
      listen 8080;

      location = /ping {
        default_type text/plain;
        return 200 'pong';
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong
  namespace: pong
  labels:
    app.kubernetes.io/name: pong
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pong
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pong-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pong
  namespace: pong
spec:
  selector:
    app.kubernetes.io/name: pong
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pong
  namespace: pong
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pong
---
# Only the Gravitee gateway may call pong, so the gateway cannot be bypassed from inside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-only
  namespace: pong
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gravitee
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apim
              app.kubernetes.io/component: gateway
      ports:
        - port: 8080
          protocol: TCP
