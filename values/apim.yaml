# Analytics (Elasticsearch) and the Developer Portal are out of scope; see README.
es:
  enabled: false
portal:
  enabled: false

# The chart ships sample users and a public token signing key. The key comes from Secret apim-jwt-secret (env below).
extraInMemoryUsers: ""
jwtSecret: ""

# No SMTP server in this setup.
smtp:
  enabled: false
notifiers:
  smtp:
    enabled: false

mongo:
  dbhost: mongodb.gravitee.svc
  rsEnabled: false
  # MongoDB requires auth; the URI with the password comes from Secret mongodb-uri (env below).
  auth:
    enabled: false

api:
  image:
    tag: 4.12.23
    pullPolicy: IfNotPresent
  analytics:
    type: none
  env:
    - name: gravitee_management_mongodb_uri
      valueFrom:
        secretKeyRef:
          name: mongodb-uri
          key: uri
    - name: gravitee_jwt_secret
      valueFrom:
        secretKeyRef:
          name: apim-jwt-secret
          key: secret
    - name: GIO_MIN_MEM
      value: 768m
    - name: GIO_MAX_MEM
      value: 768m
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  autoscaling:
    enabled: false
  deployment:
    securityContext: &securityContext
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    # The chart default only checks the TCP port, which opens before the application is ready.
    readinessProbe:
      enabled: false
    customReadinessProbe:
      httpGet:
        path: /management/organizations/DEFAULT/console
        port: http
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
  ingress:
    management:
      ingressClassName: traefik
      hosts:
        - localhost
      tls: &tls
        - hosts:
            - localhost
          secretName: localhost-tls
    portal:
      enabled: false

gateway:
  replicaCount: 2
  image:
    tag: 4.12.23
    pullPolicy: IfNotPresent
  env:
    - name: gravitee_management_mongodb_uri
      valueFrom:
        secretKeyRef:
          name: mongodb-uri
          key: uri
    - name: gravitee_ratelimit_mongodb_uri
      valueFrom:
        secretKeyRef:
          name: mongodb-uri
          key: uri
    - name: GIO_MIN_MEM
      value: 512m
    - name: GIO_MAX_MEM
      value: 512m
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: false
  deployment:
    securityContext: *securityContext
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""
  reporters:
    elasticsearch:
      enabled: false
  services:
    metrics:
      enabled: true
      prometheus:
        enabled: true
    core:
      service:
        enabled: true
        externalPort: 18082
  ingress:
    ingressClassName: traefik
    hosts:
      - localhost
    tls: *tls

ui:
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: false
  deployment:
    securityContext: *securityContext
  ingress:
    ingressClassName: traefik
    path: /console
    pathType: Prefix
    hosts:
      - localhost
    annotations:
      # The chart default targets ingress-nginx; null removes it.
      nginx.ingress.kubernetes.io/rewrite-target: null
      traefik.ingress.kubernetes.io/router.middlewares: gravitee-strip-console@kubernetescrd
    tls: *tls
